[env]
TERM = "xterm-256color"

[general]
import = [
    "~/.config/alacritty/themes/themes/alabaster_dark.toml"
]


[window]
dynamic_padding = true
opacity = 0.95
blur = true
startup_mode = "Windowed"
decorations = "None"

[window.padding]
x = 10
y = 10

[font]
size = 16.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

